[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-coach"
version = "0.1.0"
description = "A decision-procedure trainer for chess: it drills the five-step thinking routine, not just engine moves."
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
chess-coach = "chess_coach.cli:app"

[tool.setuptools.packages.find]
include = ["chess_coach*"]

[tool.pytest.ini_options]
# Let the tests import `chess_coach` without installing the package.
pythonpath = ["."]
testpaths = ["tests"]
